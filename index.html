 {t:'World Lore',sub:'What is left of the parish, pinned up by the last Wardens',e:[
  ['The Night the Sky Bled',"There was no moon. The sky split like a wound and the veils between the worlds tore open. The church bells rang by themselves until the ropes burned through. By dawn nobody was counting the dead."],
  ['The Breaches',"Wherever the veil was thinnest, the wound never closed. A breach is hell's own architecture grafted onto a ruined building, and an archdemon sits inside it like a nail in a plank."],
  ['The Parish',"Seven buildings still stand out of a whole parish: chapels, mills, a foundry, a crypt. Every one of them is defiled. The doors hang open and nothing inside is the way it was."],
  ['The Ash-Fields',"Between the ruins the ground is grey ash, cracked open and glowing like a forge. The only things growing are tall black thorns that look like they are waiting for something."],
  ['The Dark',"Daylight stopped being reliable. A thick unnatural dark crawls between the buildings. A lantern shows you a few paces, and the hellfire in the cracks shows you nothing worth seeing."],
  ['The Tithe',"When the bell tolls, the Breach wants its due. Stand inside the chalk ward-ring and hold your nerve for ten breaths, or it takes something from your pack, or half the bounty you carry."],
  ['Collapse',"The old exits do not last. Fire, rot or rubble can take a waystation while you are deep in the parish, and no bell warns you. Only the map keeps count of what is left."],
  ['Hellfire Rain',"Sometimes the sky itself spits. A red ring blooms on the ground and a breath later a meteor lands in it. The craters burn for a long while, and they love doorways."],
  ['The Fog',"Some nights the ash settles into a wet grey wall. You cannot see your own boots. A flare is a candle in a flooded room, and the horde, which never needed eyes, does not care."],
  ['The Old Waystations',"The Order's wards still hold at a few waystations. Stand in the ring and keep your nerve for three long breaths, and the way home opens. They are never where you remember them."],
  ['Unfinished',"Whatever tore the veil open is not finished. The cracks are still getting wider. Burn what you can and do not trust the quiet."]]},
 {t:'Horde Lore',sub:'Field notes on the pit\'s lesser servants',e:[
  ['The Horde',"Hell's rank and file. Weak alone, endless together. They come for gunfire, for sprinting boots and for the smell of the living."],
  ['Imps',"Bone-horned, thin and hateful. They claw first and think never. They die easily, which is exactly why the pit keeps sending more."],
  ['Skitters',"Half the size and twice the speed, built for the chase rather than the fight. Running only makes them faster. Turn and shoot."],
  ['Bloats',"Swollen wet things that drag themselves toward you and burst. The blast hurts anything nearby, demons included. Pop them while they are far away, or while they are in a crowd."],
  ['Thorn-Vines',"They keep their distance and lash out with a bleeding whip in a straight line. A red warning marks the line before it strikes. Step sideways and it misses."],
  ['Brutes',"Huge, slow, horned and heavy-handed. They take a lot of lead and hit like a cart. Keep moving, keep firing, and never let one corner you."],
  ['Every Shot Is a Dinner Bell',"Gunfire, sprinting and banishing rites all carry across the ash. The louder the gun, the farther it carries. The silver crossbow barely whispers."]]},
 {t:'Archdemon Lore',sub:'Three lords, three breaches, three bounties',e:[
  ['The Archdemons',"Great lords of hell, each anchored to a breach in the parish. Each carries a bounty from the Order. Kill one and it is still not gone."],
  ['Gorrath the Maw',"A charging brute of the pit. He lowers his head, the ground shakes, and he is on you. Sidestep the charge and punish the recovery. Bounty: $450."],
  ['Nyxara, Cinder Witch',"She hurls hellfire from a distance and cackles while she does it. Never stand still in her sight. Break the line of sight, or close the gap. Bounty: $400."],
  ['Mordrek the Choir-Eater',"He sings and the pit answers. Every few moments more of the horde appear at his side. End him quickly before the choir swells. Bounty: $500."],
  ['Where They Lair',"An archdemon never leaves its breach. The breach is always the building farthest from camp, and three burned sigils will mark it in red on your map."],
  ['Banishing',"A slain archdemon crawls back unless it is banished. Hold the rite over the corpse for five long seconds. The whole parish will hear you doing it."],
  ['The Bounty',"The Order pays on extraction, not on the kill. A banished demon is worth nothing to a dead Warden."],
  ['The Way Out',"Two escape routes wait at the parish edge: the Order's plague wagon and the ferryman's boat. Step into the ward-ring and hold your ground. Ten long seconds, and then you are carried off, no prayer required."]]},
 {t:'Hunter Lore',sub:'The Wardens\' own notes. Read them, or end up in them',e:[
  ['The Wardens',"The last of an old order. Hooded plague doctors in bone masks, armed with whatever the pit has not yet taken."],
  ['The Mask',"The beak once held herbs against plague. Now it holds wards, and the runes on the chest burn when something unholy is close. Some Wardens swore their own vows: the Penitent, the Ashen Doctor, the Gravedigger and the Bone Saint."],
  ['Sigils',"Red crosses scratched into the stone of the defiled buildings. Burn all three and the archdemon's breach is revealed. You have to stand close and stay put to do it."],
  ['Holy Water',"Blessed and bottled. It closes wounds and clears the head. Carry three if you can. Drink one before it is too late, not after."],
  ['Hellfire Flask',"Pitch, lamp oil and a rag in the neck. It bursts into a pool of fire that burns for five seconds. Anything standing in it burns. That includes you."],
  ['Signal Flare',"Burns hot and bright for fourteen seconds. The dark pulls back around it, and the horde cannot help but go to it. Throw it away from yourself."],
  ["Saint's Ward",'A reliquary charm on a chain. Hold it tight and the hits land softer for ten seconds. It does not make you a saint.'],
  ['Blessed Charges',"A hand-thrown blessing that goes off with a bang. It drops anything small and lights up the whole dark. It also lights up you."],
  ['Tapping Into the Veil',"Tap into the veil and the dark thins. You will see the red eyes of the horde, and where the sigils are hiding."],
  ['The Ledger',"What your character carries dies with them. The stash is safe, and the backpack survives a clean escape. Spend the bounty before it spends you."],
  ['The Rule of the Hunt',"Burn the sigils. Kill the demon. Banish the corpse. Run for an exit and stand in its ring until it carries you off. Never stand still in the dark, except there."]]}
];

const MUS=(()=>{let ac,mst,dly,nb,on=0,tm=null,nextB=0,nextH=0;const off=()=>{try{return localStorage.getItem('bh_amb')=='0'}catch(e){return 0}};
 function start(){if(ac){if(ac.state!='running')ac.resume();return}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{ac=new AC()}catch(e){ac=null;return}

  dly=ac.createDelay(2);dly.delayTime.value=.62;const fb=ac.createGain();fb.gain.value=.5;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;dly.connect(lp);lp.connect(fb);fb.connect(dly);const dg=ac.createGain();dg.gain.value=.8;lp.connect(dg);dg.connect(mst);

  const pf=ac.createBiquadFilter();pf.type='lowpass';pf.frequency.value=320;pf.Q.value=2;const pg=ac.createGain();pg.gain.value=.07;pf.connect(pg);pg.connect(mst);pg.connect(dly);
  [220,233.08,329.6].forEach((f,i)=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f+i*.3;o.detune.value=i*5;o.connect(pf);o.start()});
  const lf=ac.createOscillator(),lg=ac.createGain();lf.frequency.value=.07;lg.gain.value=170;lf.connect(lg);lg.connect(pf.frequency);lf.start();
  const tl=ac.createOscillator(),tg=ac.createGain();tl.frequency.value=.11;tg.gain.value=.03;tl.connect(tg);tg.connect(pg.gain);tl.start();
  tm=setInterval(tick,700)}
 const SC=[440,466.16,523.25,622.25,659.25,349.23,311.13];
 function bell(t){const f=SC[Math.random()*SC.length|0]*(Math.random()<.25?.5:1),g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+3.4);g.connect(mst);g.connect(dly);
  [[1,1],[2.76,.25],[5.4,.08]].forEach(h=>{const o=ac.createOscillator(),q=ac.createGain();o.type='sine';o.frequency.value=f*h[0];q.gain.value=h[1];o.connect(q);q.connect(g);o.start(t);o.stop(t+3.5)})}
 function breath(t){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=6;f.frequency.setValueAtTime(500+Math.random()*900,t);f.frequency.linearRampToValueAtTime(260+Math.random()*300,t+5);
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.022,t+2.4);g.gain.linearRampToValueAtTime(0,t+5);s.connect(f);f.connect(g);g.connect(mst);g.connect(dly);s.start(t,Math.random());s.stop(t+5.1)}
 function tick(){if(!ac)return;const want=mode=='menu'&&!document.hidden&&!off()&&ac.state=='running',t=ac.currentTime;mst.gain.setTargetAtTime(want?.16:0,t,want?1.2:.5);on=want;if(!want){nextB=Math.max(nextB,t+2);nextH=Math.max(nextH,t+6);return}
  if(t>nextB-.5){bell(Math.max(t+.05,nextB));nextB=t+3.5+Math.random()*6}if(t>nextH){breath(t+.1);nextH=t+9+Math.random()*10}}
 function click(){if(!ac||ac.state!='running'||mode!='menu'||off())return;const t=ac.currentTime+.005,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(62,t+.14);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);
  const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=700+Math.random()*500;f.Q.value=3;const n=ac.createGain();n.gain.setValueAtTime(.05,t);n.gain.exponentialRampToValueAtTime(.0001,t+.07);s.connect(f);f.connect(n);n.connect(ac.destination);s.start(t,Math.random()*1.5);s.stop(t+.09);
  const gp=ac.createOscillator(),pg=ac.createGain(),fq=[311.13,369.99,415.3,466.16][Math.random()*4|0];gp.type='sine';gp.frequency.value=fq;gp.detune.value=Math.random()*14-7;pg.gain.setValueAtTime(0,t);pg.gain.linearRampToValueAtTime(.022,t+.02);pg.gain.exponentialRampToValueAtTime(.0001,t+1.3);gp.connect(pg);pg.connect(ac.destination);pg.connect(dly);gp.start(t);gp.stop(t+1.4)}
 function ruffle(){if(!ac||ac.state!='running'||mode!='menu'||off())return;const t0=ac.currentTime+.005,n=7+(Math.random()*4|0);
  for(let i=0;i<n;i++){const t=t0+i*.04+Math.random()*.05,d=.03+Math.random()*.07,s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2200+Math.random()*3800;f.Q.value=.9;const h=ac.createBiquadFilter();h.type='highpass';h.frequency.value=900;const g=ac.createGain(),pk=(.07+Math.random()*.06)*(1-i/(n*1.4));g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(h);h.connect(g);g.connect(ac.destination);s.start(t,Math.random()*1.7);s.stop(t+d+.02)}
  const s2=ac.createBufferSource();s2.buffer=nb;const f2=ac.createBiquadFilter();f2.type='bandpass';f2.frequency.setValueAtTime(1500,t0);f2.frequency.linearRampToValueAtTime(3200,t0+.35);f2.Q.value=.6;const g2=ac.createGain();g2.gain.setValueAtTime(0,t0);g2.gain.linearRampToValueAtTime(.03,t0+.12);g2.gain.linearRampToValueAtTime(0,t0+.38);s2.connect(f2);f2.connect(g2);g2.connect(ac.destination);s2.start(t0,Math.random()*1.5);s2.stop(t0+.4)}
 function cash(){if(!ac||ac.state!='running'||mode!='menu'||off())return;const t0=ac.currentTime+.005,n=18;
  for(let i=0;i<n;i++){const t=t0+i*.021+Math.random()*.008,d=.02+Math.random()*.03,s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=3500+Math.random()*3500;f.Q.value=1.4;const h=ac.createBiquadFilter();h.type='highpass';h.frequency.value=1800;const g=ac.createGain(),pk=(.06+Math.random()*.05)*(1-i/(n*1.6));g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(h);h.connect(g);g.connect(ac.destination);s.start(t,Math.random()*1.7);s.stop(t+d+.02)}
  const s2=ac.createBufferSource();s2.buffer=nb;const f2=ac.createBiquadFilter();f2.type='bandpass';f2.frequency.value=4800;f2.Q.value=.5;const g2=ac.createGain();g2.gain.setValueAtTime(0,t0);g2.gain.linearRampToValueAtTime(.025,t0+.1);g2.gain.linearRampToValueAtTime(0,t0+.42);s2.connect(f2);f2.connect(g2);g2.connect(ac.destination);s2.start(t0,Math.random()*1.5);s2.stop(t0+.45)}
 return{start,click,tick,ruffle,cash}})();
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(mode=='menu'){MUS.start();MUS.tick()}},true));
addEventListener('click',e=>{if(mode!='menu')return;const t=e.target&&e.target.closest&&e.target.closest('#menu');if(!t)return;if(e.target.closest('button,.chalk,.tb,.fd,.paper,.it,[data-v],[data-l],[data-lo],[data-f],[data-k],[data-p],[data-s],[data-t],[data-w],[data-m],[data-xa],[data-bq],[data-y],[data-n],#go')){MUS.start();if(e.target.closest('[data-y]'))MUS.cash();else if(e.target.closest('[data-lo]'))MUS.ruffle();else MUS.click()}},true);
